<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUS Module 8 - Basic React</title>

    <!-- React and ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    
    <!-- Create a div with id of root-->
     <div id="root">
 
     </div>

     <!-- Create a react componet inside script tag-->
      <script type="text/babel">
        function App(){
            return(
                <>
                    <h1> Welcome to NUS Module 8 </h1>
                    <h3> Task 2 : Set Up a Basic React Environment </h3>
                    <p> This is a basic setup for react. This is an html page which renders some text using basic html tags.</p>
                </>
            )
        }

        const root = ReactDOM.createRoot(document.querySelector("#root")); 
        root.render(         
            <App/>  
        )
      </script>
</body>
</html>
